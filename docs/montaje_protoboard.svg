<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Consolas,Menlo,monospace">
  <rect width="900" height="600" fill="#12141a"/>
  <text x="26" y="34" fill="#e8eaed" font-size="18" font-weight="bold">Montaje: ESP32 + 1x nRF24L01+ PA/LNA (vista superior)</text>
  <text x="26" y="54" fill="#8b93a1" font-size="11">Cableado segun Rab-77/cypher-jammer · smoochie_version/FOR VSPI PIN.ino</text>

  <!-- breadboard body -->
  <rect x="60" y="150" width="580" height="330" rx="6" fill="#1e1e22" stroke="#555" stroke-width="1.5"/>

  <!-- rails -->
  <line x1="70" y1="185" x2="630" y2="185" stroke="#c0392b" stroke-width="2"/>
  <line x1="70" y1="445" x2="630" y2="445" stroke="#2980b9" stroke-width="2"/>
  <text x="636" y="190" fill="#c0392b" font-size="11">+  3.3V / 5V</text>
  <text x="636" y="450" fill="#2980b9" font-size="11">-  GND</text>

  <!-- terminal strips: dots -->
  <g fill="#6b7280">
    <circle cx="95" cy="165" r="2.2"/><circle cx="120" cy="165" r="2.2"/><circle cx="145" cy="165" r="2.2"/><circle cx="170" cy="165" r="2.2"/>
    <circle cx="95" cy="465" r="2.2"/><circle cx="120" cy="465" r="2.2"/><circle cx="145" cy="465" r="2.2"/><circle cx="170" cy="465" r="2.2"/>
  </g>

  <!-- main matrix dots -->
  <g fill="#4a4f57">
    <circle cx="95" cy="230" r="2.4"/><circle cx="120" cy="230" r="2.4"/><circle cx="145" cy="230" r="2.4"/>
    <circle cx="400" cy="230" r="2.4"/><circle cx="425" cy="230" r="2.4"/><circle cx="450" cy="230" r="2.4"/><circle cx="475" cy="230" r="2.4"/>
    <circle cx="95" cy="265" r="2.4"/><circle cx="120" cy="265" r="2.4"/><circle cx="145" cy="265" r="2.4"/>
    <circle cx="400" cy="265" r="2.4"/><circle cx="425" cy="265" r="2.4"/><circle cx="450" cy="265" r="2.4"/><circle cx="475" cy="265" r="2.4"/>
    <circle cx="95" cy="345" r="2.4"/><circle cx="120" cy="345" r="2.4"/><circle cx="145" cy="345" r="2.4"/>
    <circle cx="400" cy="345" r="2.4"/><circle cx="425" cy="345" r="2.4"/><circle cx="450" cy="345" r="2.4"/><circle cx="475" cy="345" r="2.4"/>
    <circle cx="95" cy="380" r="2.4"/><circle cx="120" cy="380" r="2.4"/><circle cx="145" cy="380" r="2.4"/>
    <circle cx="400" cy="380" r="2.4"/><circle cx="425" cy="380" r="2.4"/><circle cx="450" cy="380" r="2.4"/><circle cx="475" cy="380" r="2.4"/>
  </g>
  <text x="540" y="310" fill="#3f444c" font-size="11">campo central sin</text>
  <text x="540" y="326" fill="#3f444c" font-size="11">conexion electrica</text>
  <line x1="90" y1="305" x2="490" y2="305" stroke="#2a2d33" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="90" y1="315" x2="490" y2="315" stroke="#2a2d33" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- MB V2 regulator -->
  <rect x="72" y="212" width="78" height="96" rx="5" fill="#1f2420" stroke="#52e052" stroke-width="2"/>
  <text x="111" y="240" fill="#7ee787" font-size="10" font-weight="bold" text-anchor="middle">MB V2</text>
  <text x="111" y="254" fill="#7ee787" font-size="10" font-weight="bold" text-anchor="middle">AMS1117</text>
  <text x="111" y="278" fill="#6b8f6b" font-size="8.5" text-anchor="middle">3.3V / 5V</text>
  <text x="111" y="292" fill="#6b8f6b" font-size="8.5" text-anchor="middle">700mA</text>
  <line x1="111" y1="185" x2="111" y2="212" stroke="#52e052" stroke-width="3"/>
  <line x1="111" y1="308" x2="111" y2="445" stroke="#2980b9" stroke-width="3"/>

  <!-- nRF24 -->
  <rect x="392" y="240" width="92" height="84" rx="5" fill="#2b2018" stroke="#f0b860" stroke-width="2"/>
  <text x="438" y="266" fill="#f0b860" font-size="10.5" font-weight="bold" text-anchor="middle">nRF24L01+</text>
  <text x="438" y="280" fill="#f0b860" font-size="10.5" font-weight="bold" text-anchor="middle">PA/LNA</text>
  <line x1="484" y1="272" x2="540" y2="200" stroke="#f0b860" stroke-width="4" stroke-linecap="round"/>
  <circle cx="544" cy="196" r="7" fill="none" stroke="#f0b860" stroke-width="4"/>
  <text x="500" y="192" fill="#8b7a5e" font-size="9">SMA 2dBi</text>
  <g font-size="8.5" fill="#c9d1d9">
    <text x="398" y="238">1</text><text x="412" y="238">2</text><text x="426" y="238">3</text><text x="440" y="238">4</text>
    <text x="454" y="238">5</text><text x="468" y="238">6</text><text x="482" y="238">7</text>
  </g>
  <text x="330" y="290" fill="#c9d1d9" font-size="9.5">GND CSN CE SCK MOSI MISO VCC</text>

  <!-- capacitor -->
  <g>
    <rect x="300" y="238" width="14" height="40" rx="3" fill="#1c2b33" stroke="#5aa9c9" stroke-width="1.5"/>
    <line x1="307" y1="185" x2="307" y2="238" stroke="#5aa9c9" stroke-width="2"/>
    <line x1="322" y1="185" x2="322" y2="238" stroke="#5aa9c9" stroke-width="2"/>
    <text x="345" y="222" fill="#5aa9c9" font-size="10" font-weight="bold">100uF</text>
    <text x="345" y="236" fill="#4a7f96" font-size="9">16V o 25V</text>
  </g>

  <!-- ESP32 -->
  <rect x="690" y="130" width="180" height="300" rx="8" fill="#1c2733" stroke="#3d7ea6" stroke-width="2"/>
  <text x="708" y="156" fill="#6fc3f7" font-size="13" font-weight="bold">ESP32 DevKit V1</text>
  <text x="708" y="172" fill="#6b7280" font-size="9.5">30 pines · USB-C</text>
  <g font-size="10" fill="#e8eaed">
    <text x="866" y="212" text-anchor="end">GPIO 22 → CE</text>
    <text x="866" y="244" text-anchor="end">GPIO 21 → CSN</text>
    <text x="866" y="276" text-anchor="end">GPIO 18 → SCK</text>
    <text x="866" y="308" text-anchor="end">GPIO 23 → MOSI</text>
    <text x="866" y="340" text-anchor="end">GPIO 19 → MISO</text>
    <text x="866" y="382" text-anchor="end">GPIO 33 → boton</text>
    <text x="866" y="412" text-anchor="end">GND → rail -</text>
  </g>
  <g fill="#3d7ea6">
    <circle cx="870" cy="208" r="4"/><circle cx="870" cy="240" r="4"/><circle cx="870" cy="272" r="4"/>
    <circle cx="870" cy="304" r="4"/><circle cx="870" cy="336" r="4"/><circle cx="870" cy="378" r="4"/>
  </g>
  <circle cx="870" cy="408" r="4" fill="#c9954a"/>

  <!-- signal wires -->
  <g stroke-width="1.8" fill="none">
    <line x1="870" y1="208" x2="440" y2="300" stroke="#e05252"/>
    <line x1="870" y1="240" x2="426" y2="300" stroke="#e05252"/>
    <line x1="870" y1="272" x2="412" y2="300" stroke="#52e052"/>
    <line x1="870" y1="304" x2="398" y2="300" stroke="#e0c052"/>
    <line x1="870" y1="336" x2="384" y2="300" stroke="#5252e0"/>
  </g>
  <line x1="870" y1="408" x2="170" y2="465" stroke="#c9954a" stroke-width="2.5"/>
  <text x="330" y="452" fill="#f0b860" font-size="10.5" font-weight="bold">GND COMUN — sin esto no hay SPI</text>

  <!-- warning -->
  <rect x="26" y="510" width="848" height="66" rx="5" fill="#3a1f1f" stroke="#e05252"/>
  <text x="42" y="532" fill="#ff8a8a" font-size="11.5" font-weight="bold">ANTES DE ENERGIZAR — verificar</text>
  <text x="42" y="550" fill="#e8c4c4" font-size="10.5">1. Pinout real del modulo: leé el serigrafiado. El dibujo asume GND·CSN·CE·SCK·MOSI·MISO·VCC de izq a der.</text>
  <text x="42" y="566" fill="#e8c4c4" font-size="10.5">2. Polaridad del condensador: la pata larga (mas larga) va al 3.3V. 3. Ningun jumper en GND del ESP32 puede quedar flojo.</text>
</svg>