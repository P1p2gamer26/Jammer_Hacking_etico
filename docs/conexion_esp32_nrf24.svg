<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" font-family="Consolas,Menlo,monospace">
  <rect width="980" height="760" fill="#12141a"/>
  <text x="28" y="36" fill="#e8eaed" font-size="19" font-weight="bold">ESP32 + 2x nRF24L01+ PA/LNA — cableado real segun cypher-jammer</text>
  <text x="28" y="56" fill="#8b93a1" font-size="12">Fuente: Rab-77/cypher-jammer — smoochie_version/FOR DUAL PINS.ino · dos buses SPI de hardware separados</text>

  <!-- ESP32 -->
  <rect x="300" y="85" width="300" height="470" rx="8" fill="#1c2733" stroke="#3d7ea6" stroke-width="2"/>
  <text x="320" y="112" fill="#6fc3f7" font-size="15" font-weight="bold">ESP32 DevKit V1</text>
  <text x="320" y="130" fill="#6b7280" font-size="11">ESP-WROOM-32</text>

  <!-- VSPI group -->
  <rect x="312" y="150" width="276" height="150" rx="5" fill="#16202b" stroke="#2c3e50" stroke-dasharray="3,3"/>
  <text x="322" y="172" fill="#7ee787" font-size="12" font-weight="bold">VSPI (radio B)</text>
  <g font-size="11.5" fill="#e8eaed">
    <text x="580" y="196" text-anchor="end">CE  = GPIO 22</text>
    <text x="580" y="222" text-anchor="end">CSN = GPIO 21</text>
    <text x="580" y="248" text-anchor="end">SCK = GPIO 18 · MOSI = 23</text>
    <text x="580" y="274" text-anchor="end">MISO = GPIO 19</text>
  </g>

  <!-- HSPI group -->
  <rect x="312" y="320" width="276" height="150" rx="5" fill="#16202b" stroke="#2c3e50" stroke-dasharray="3,3"/>
  <text x="322" y="342" fill="#f0b860" font-size="12" font-weight="bold">HSPI (radio A)</text>
  <g font-size="11.5" fill="#e8eaed">
    <text x="580" y="366" text-anchor="end">CE  = GPIO 16</text>
    <text x="580" y="392" text-anchor="end">CSN = GPIO 15</text>
    <text x="580" y="418" text-anchor="end">SCK = GPIO 14 · MOSI = 13</text>
    <text x="580" y="444" text-anchor="end">MISO = GPIO 12</text>
  </g>

  <!-- button + power -->
  <g font-size="11.5" fill="#e8eaed">
    <text x="580" y="500" text-anchor="end">Boton toggle = GPIO 33</text>
    <text x="580" y="524" text-anchor="end">VIN 5V (USB) · GND</text>
  </g>

  <!-- radio B -->
  <rect x="720" y="130" width="230" height="200" rx="8" fill="#2b2018" stroke="#52e052" stroke-width="2"/>
  <text x="738" y="156" fill="#7ee787" font-size="14" font-weight="bold">nRF24 #2 (VSPI)</text>
  <text x="738" y="174" fill="#8b7a5e" font-size="10.5">startConstCarrier(PA_MAX, ch1)</text>
  <line x1="944" y1="220" x2="970" y2="160" stroke="#52e052" stroke-width="4" stroke-linecap="round"/>
  <g font-size="11" fill="#e8eaed">
    <text x="738" y="212">3 CE  ·  2 CSN</text>
    <text x="738" y="236">4 SCK · 5 MOSI</text>
    <text x="738" y="260">6 MISO · 7 VCC</text>
    <text x="738" y="284">1 GND · 8 IRQ(n/a)</text>
  </g>

  <!-- radio A -->
  <rect x="720" y="360" width="230" height="200" rx="8" fill="#2b2018" stroke="#f0b860" stroke-width="2"/>
  <text x="738" y="386" fill="#f0b860" font-size="14" font-weight="bold">nRF24 #1 (HSPI)</text>
  <text x="738" y="404" fill="#8b7a5e" font-size="10.5">startConstCarrier(PA_MAX, ch)</text>
  <line x1="944" y1="450" x2="970" y2="390" stroke="#f0b860" stroke-width="4" stroke-linecap="round"/>
  <g font-size="11" fill="#e8eaed">
    <text x="738" y="442">3 CE  ·  2 CSN</text>
    <text x="738" y="466">4 SCK · 5 MOSI</text>
    <text x="738" y="490">6 MISO · 7 VCC</text>
    <text x="738" y="514">1 GND · 8 IRQ(n/a)</text>
  </g>

  <!-- wires B -->
  <g stroke="#52e052" stroke-width="1.8" fill="none" opacity="0.85">
    <line x1="600" y1="192" x2="720" y2="200"/>
    <line x1="600" y1="218" x2="720" y2="214"/>
    <line x1="600" y1="244" x2="720" y2="228"/>
    <line x1="600" y1="270" x2="720" y2="242"/>
    <line x1="600" y1="296" x2="720" y2="256"/>
  </g>

  <!-- wires A -->
  <g stroke="#f0b860" stroke-width="1.8" fill="none" opacity="0.85">
    <line x1="600" y1="362" x2="720" y2="430"/>
    <line x1="600" y1="388" x2="720" y2="444"/>
    <line x1="600" y1="414" x2="720" y2="458"/>
    <line x1="600" y1="440" x2="720" y2="472"/>
    <line x1="600" y1="466" x2="720" y2="486"/>
  </g>

  <!-- ESP32 deinit note -->
  <rect x="300" y="570" width="300" height="52" rx="4" fill="#2b2410" stroke="#c9954a"/>
  <text x="312" y="590" fill="#f0b860" font-size="10.5">En setup(): esp_bt_controller_deinit(),</text>
  <text x="312" y="608" fill="#f0b860" font-size="10.5">esp_wifi_stop/deinit — libera la radio propia</text>

  <!-- power section -->
  <rect x="28" y="640" width="922" height="105" rx="8" fill="#1f2420" stroke="#52e052" stroke-width="2"/>
  <text x="46" y="666" fill="#7ee787" font-size="14" font-weight="bold">ALIMENTACION — 2 fuentes separadas, una por radio</text>
  <text x="46" y="694" fill="#c9d1d9" font-size="11.5">VIN 5V ESP32 → AMS1117-3.3V #1 → VCC (pin 7) del nRF24 #1 —  + cap 100µF (470µF mejor)</text>
  <text x="46" y="714" fill="#c9d1d9" font-size="11.5">VIN 5V ESP32 → AMS1117-3.3V #2 → VCC (pin 7) del nRF24 #2  —  + cap 100µF (470µF mejor)</text>
  <text x="46" y="734" fill="#c9d1d9" font-size="11.5">Los GND de ambos modulos van al GND comun del ESP32. 115 mA en TX: el 3.3V del ESP32 no lo banca.</text>
</svg>